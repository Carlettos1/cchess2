[workspace]
members = ["core", "AI", "tui", "session"]
default-members = [".", "core", "AI", "tui", "session"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cchess-core = { path = "core" }
cchess-ai = { path = "AI" }
cchess-tui = { path = "tui" }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
crossterm = "0.29"

[package]
name = "cchess-engine"
version.workspace = true
edition.workspace = true
default-run = "cchess-engine"

[dependencies]
cchess-core.workspace = true
cchess-ai.workspace = true
cchess-tui.workspace = true
ron.workspace = true

[dev-dependencies]
crossterm.workspace = true
