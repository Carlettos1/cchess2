[package]
name = "cchess-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cchess-session = { path = "../../session" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
